schema_version = 2

[board]
name = "ginkgo"
soc = "SM6125"
soc_source = "sm6125"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi Note 8 (ginkgo, SM6125, Tianma NT36672A, 4GB/64GB eMMC)"
kit = "ginkgo"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "VerifiedRoot", "GopFramebuffer", "AppleKeyStoreState", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "ginkgo_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm6125.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/ginkgo.dts"
include_dirs = ["soc:dts"]

[userdata]
first_lba = 0x1298000
last_lba = 0x747bfde
lba_bytes = 512

[firmware]
config = "ginkgo"
dsc = "Platforms/Xiaomi/ginkgoPkg/ginkgo.dsc"
fd = "Build/ginkgoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = []
patches = [
  "Resources/MuPatches/Auth-Service.patch",
  "Resources/MuPatches/Boot-Manager.patch",
  "Resources/MuPatches/Timer.patch",
  "Resources/MuPatches/Usb-Bus.patch",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "ginkgo-unixnu"

# ABL do Redmi Note 8 (ginkgo, MIUI 12.5 Android 11) exige header_version = 2 com DTB separado.
# O empacotamento determinístico em boot v2 é feito por scripts/pack-boot-v2.py.
[bootimg.image]
header_version = 2
base = 0x00000000
kernel_offset = 0x00008000
ramdisk_offset = 0x01000000
ramdisk_compression = "uefi-chunks"
tags_offset = 0x00000100
dtb_offset = 0x01f00000
pagesize = 4096
os_version = "11.0.0"
os_patch_level = "2022-02"

[payload]
volume = "GINKGO"
size_mib = 64
loader = "firmware"
title = "UniXNU - Redmi Note 8 (ginkgo)"
timeout = -1
panic_screen = true
tools = true
dram_size = 0xc0000000
skip_setup_tool = "scripts/seed-data-skip-setup.py"
skip_setup_args = ["--no-auto-dim"]
kernel_args = [
  "smp=1",
  "armcpu-self-ipi=1",
  "aks=1",
  "aks-sls=3",
  "offline-key-events=1",
  "sm6125-emmc-block=3",
  "sm6125-data-persist=1",
  "sm6125-skip-setup=1",
  "sm6125-touch=5",
  "no-lc=1",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "offline-mobile-graphics-load=1",
  "offline-mobile-graphics-client=1",
  "offline-legacy-register=1",
  "offline-legacy-phase=4",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-retire=1",
  "vsync=60",
  "sched_preemption_disable_debug_mode=0",
  "interrupt-masked-debug-mode=0",
  "validation_disables=0x11040",
  "-v",
  "serial=3",
  "debug=0x14e",
  "pmgr=2",
]

[payload.adt]
chip_id = "6125"
unique_chip_id = "required"
owned_memory_size = 0xb4000000
packed_data_ramdisk = true
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[package.defconfig]
"ipados-17.7.11-21H461" = "ginkgo_defconfig"

[adt.product.string]
model = "J120AP"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1
vmm-present = 1
"kern.maxvnodes" = 47104

[adt.chosen.u32]
kernel-ctrr-to-be-enabled = 0

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2
